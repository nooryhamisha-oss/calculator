<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>Math Magician</h1>

        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="calculator.html" class="active">Calculator</a>
            <a href="quote.html" class="active">Quote</a>
        </nav>
    </header>

    <main class="calculator">

        <h2>Lets Do Some Math...</h2>

        <div class="calculator-box">

            <div class="display">
                <span>0</span>
            </div>

            <div class="buttons">

                <button>AC</button>
                <button>+/-</button>
                <button>%</button>
                <button>÷</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>×</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>−</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>

                <button class="zero">0</button>
                <button>.</button>
                <button>=</button>

            </div>

        </div>

    </main>

</body>
</html>
